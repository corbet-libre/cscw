[package]
name = "cscw"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Caller-authorized deposit operations and private domain facts over payment adapters"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cscw"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
cpmt = { git = "https://git.corbet.ch/corbet-foss/cpmt", branch = "main" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cpmt = { git = "https://git.corbet.ch/corbet-foss/cpmt", branch = "main", features = ["stripe"] }
async-stripe = { version = "1.0.0-rc.9", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-aws-lc-rs", "redact-generated-debug"] }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }
serde_json = "1"
